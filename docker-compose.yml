services:
  # ── SaaS PostgreSQL database ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz_saas
      POSTGRES_PASSWORD: postiz_saas
      POSTGRES_DB: postiz_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz_saas -d postiz_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Wasp app (server on 3001, client on 3000) ────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3001}
    volumes:
      # Mount your server env file into the container
      - ./.env.server.production:/app/env/server.env:ro

volumes:
  postgres_data:
