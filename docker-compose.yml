services:
  # ── SaaS PostgreSQL database ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz_saas
      POSTGRES_PASSWORD: postiz_saas
      POSTGRES_DB: postiz_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz_saas -d postiz_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Wasp server (API + auth + webhooks) ───────────────────────────────
  server:
    build:
      context: .wasp/out
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    env_file:
      - .env.server.production
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://postiz_saas:postiz_saas@db:5432/postiz_saas

  # ── Nginx (serves client + reverse proxies API) ───────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.wasp/out/web-app/dist:/usr/share/nginx/html:ro
      # Uncomment if using Let's Encrypt / certbot:
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro

volumes:
  postgres_data:
