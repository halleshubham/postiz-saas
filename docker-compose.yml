services:
  # ── SaaS PostgreSQL database ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postiz_saas
      POSTGRES_PASSWORD: postiz_saas
      POSTGRES_DB: postiz_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz_saas -d postiz_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Wasp app (SSR — serves both API and client on port 3001) ─────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./.env.server.production:/app/env/server.env:ro

volumes:
  postgres_data:
